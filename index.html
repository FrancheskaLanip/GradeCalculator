<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sheet">
  <header>
    <h1>Grade Calculator</h1>
    <p>Add each subject with its grade and unit weight to compute a running weighted average.</p>
  </header>

  <form id="gradeForm">
    <div>
      <label for="subject">Subject</label>
      <input type="text" id="subject" placeholder="e.g. Web Development" required maxlength="30">
    </div>
    <div>
      <label for="grade">Grade</label>
      <input type="number" id="grade" placeholder="0-100" min="0" max="100" step="0.1" required>
    </div>
    <div>
      <label for="units">Units</label>
      <input type="number" id="units" placeholder="e.g. 3" min="0.5" max="10" step="0.5" required>
    </div>
    <div class="err" id="formError"></div>
    <button type="submit" class="add-btn">Add subject</button>
  </form>

  <div class="ledger" id="ledger"></div>

  <div class="summary">
    <span class="label">Weighted average</span>
    <span class="value" id="avgValue">—</span>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
